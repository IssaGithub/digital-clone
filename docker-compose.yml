services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: klon
      POSTGRES_PASSWORD: klon
      POSTGRES_DB: klon
    ports:
      - "5432:5432"
    volumes:
      - klon_pg:/var/lib/postgresql/data

volumes:
  klon_pg:
